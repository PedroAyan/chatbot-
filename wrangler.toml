name = "whatsapp-restaurante-bot"
main = "src/index.js"
compatibility_date = "2026-09-15"

[vars]
# Deixe [] para usar o cardápio padrão de buffets, salgados, bebidas e sobremesas.
PRODUCTS_JSON = '[]'
PIX_KEY = ""
PIX_RECIPIENT = ""
BUSINESS_NAME = "Darling Carolis"
TIMEZONE = "America/Sao_Paulo"
OPENING_HOURS = "Segunda a sábado, 11h às 23h; domingo, 11h às 18h"
ADDRESS = "Atualize o endereço em wrangler.toml"
MENU_URL = "https://example.com/cardapio"
DELIVERY_BASE_FEE = "6.00"
DELIVERY_MINUTES = "45"
PAYMENT_PIX_LINK = ""

[triggers]
crons = ["*/15 * * * *"]

# Depois de criar o banco, substitua o database_id:
[[d1_databases]]
binding = "DB"
database_name = "whatsapp-restaurante"
database_id = "7e7e2538-f1d1-4d0e-8373-681af7d9a282"
